# V3 regression settings: (A) layer-average soil parameters from location + soil class and
# (B) property-to-property models, 0-15 m, Downtown, under V3's spatial CV (106 m blocks).
# The folds and the 11 external-holdout boreholes are V3's (read from the V3 folder, never changed).

[run]
# quick = true runs a tiny version (1 outer fold, 2 Optuna trials, small models) to check the code.
# Quick results are NEVER thesis results.
quick = false
seed = 20261103
n_jobs = 4

[v3]
# V5 READS (never writes): data/folds/ (blockCV folds, block size), data/processed/external_holdout.csv
# and config/external_holdout.lock.json
folder = "E:/DavidAn/SiemReapML_V3_fresh_start/SiemReapML"

[files]
boreholes_csv = "data/raw/SiemReap_BH_Master_Downtown_DEM_Region_v1_ArcGIS.csv"
boreholes_sha256 = "caf59d0b4bd244303fc48679d28fc62fd572c9175a856744b07554e48f380f72"
region_downtown = "Downtown"

[samples]
# One row = one sample record with a measured value. Its depth is the middle of the record.
top_m = 0.0
bottom_m = 15.0                   # middle depth must lie in [top_m, bottom_m]
max_sample_length_m = 3.0         # longer records are not point values
outlier_sd = 3.0                  # drop values beyond mean +- 3 SD of each target (as Khamjan et al. 2026); 0 = off

# ------------------------------------------------------------------ targets ----
# column  = column in the borehole CSV
# log     = true: models learn log(1 + value); every score is on the original scale
# min/max = values outside are treated as errors and dropped (reported in notebook 01)
[targets.SPT_N]
column = "SPT_N"
unit = "blows/30 cm"
log = true
min = 0
max = 60                          # as Khamjan et al. (2026): N > 60 treated as refusal

[targets.Water_Content]
column = "Water_Content_pct"
unit = "%"
log = false
min = 0
max = 150

[targets.LL]
column = "LL_pct"
unit = "%"
log = false
min = 0
max = 150

[targets.PI]
column = "PI_pct"
unit = "%"
log = false
min = 0
max = 100

[targets.Void_Ratio]
column = "Void_Ratio"
unit = "-"
log = false
min = 0.1
max = 4.0

[targets.Wet_Unit_Weight]
column = "Wet_Unit_Weight_kN_m3"
unit = "kN/m3"
log = false
min = 12
max = 25

[targets.Specific_Gravity]
column = "Specific_Gravity"
unit = "-"
log = false
min = 2.4
max = 3.0

[targets.Su]
column = "Su_kPa"
unit = "kPa"
log = true
min = 0
max = 500
uscs = ["CL", "CH"]               # clay samples only: the compressible layer

[cv]
k = 5
# Chosen for settlement from groundwater lowering (InSAR): e0, w, LL/PI (Cc correlations),
# unit weight (stress change), SPT-N (stiffness of sand layers), Su of the clay (soft-clay
# strength; correlates with stiffness and OCR), Gs (check of e0 = w Gs)
targets = ["Water_Content", "Void_Ratio", "LL", "PI", "Wet_Unit_Weight", "Specific_Gravity", "SPT_N", "Su"]
models = ["RF", "XGB", "MLP", "GWRF", "GWXGB"]   # plus the depth-only reference "Depth" (no tuning)
block_multiples = [1]             # V3's 106 m blocks only
depth_bin_m = 1.0                 # depth-only reference: training mean per 1 m slice
depth_min_samples = 5             # slices with fewer training samples use the overall mean

[layers]
# A. LAYER models: target = mean of a borehole's samples in each layer (0-1.5 m, 1.5-3 m, ...)
layer_m = 1.5

[property]
# B. PROPERTY models: target predicted from other parameters measured on the same sample
#    (+ depth and logged soil class; no location). Inputs and targets are names of [targets.*].
inputs = ["Water_Content"]        # the most often measured property (about half the records)
targets = ["Void_Ratio", "Wet_Unit_Weight", "Specific_Gravity", "LL", "PI", "Su"]
models = ["RF", "XGB"]            # plus "Linear" (least squares on the inputs) and "Depth"

[soil_class]
# The 4th input: the soil class of the sample as logged in the borehole. Other symbols are left out.
clay = ["CL", "CH"]               # 1
sand = ["SC", "SM", "SP"]         # 0

[cv.n_trials]
RF = 30
XGB = 30
MLP = 30
GWRF = 20
GWXGB = 20

[gw]
# Geographically weighted models (as V3): local model per training borehole from its k nearest boreholes
min_boreholes = 5
min_samples = 20                  # a neighbourhood needs at least this many samples, else the global model
max_neighbours = 80
local_rf_trees = 100
local_xgb_rounds_max = 300

[inner_cv]
# Inner folds = the other 4 outer folds; if one is too small, V3's backup inner folds are used.
min_boreholes = 8
min_samples = 30

[quick]
outer_folds = [1]
n_trials = 2
trees = 50

# ------------------------------------------------------------ Optuna search spaces ----
[space.RF]
n_estimators = { type = "int", low = 200, high = 600, step = 100 }
max_depth = { type = "int", low = 3, high = 30 }
min_samples_leaf = { type = "int", low = 1, high = 50, log = true }
max_features = { type = "int", low = 1, high = 4 }
max_samples = { type = "float", low = 0.5, high = 1.0 }

[space.XGB]
n_estimators = { type = "int", low = 100, high = 800, step = 50 }
learning_rate = { type = "float", low = 0.01, high = 0.3, log = true }
max_depth = { type = "int", low = 2, high = 10 }
min_child_weight = { type = "float", low = 1.0, high = 30.0, log = true }
subsample = { type = "float", low = 0.5, high = 1.0 }
colsample_bynode = { type = "float", low = 0.5, high = 1.0 }
reg_lambda = { type = "float", low = 0.001, high = 10.0, log = true }
gamma = { type = "float", low = 0.0, high = 5.0 }

[space.MLP]
n_layers = { type = "int", low = 1, high = 3 }
n_units = { type = "int", low = 8, high = 128, log = true }
activation = { type = "categorical", choices = ["relu", "tanh"] }
alpha = { type = "float", low = 1e-6, high = 0.1, log = true }
learning_rate_init = { type = "float", low = 1e-4, high = 1e-2, log = true }
batch_size = { type = "categorical", choices = [32, 64, 128] }
max_iter = { type = "int", low = 200, high = 1000, step = 100 }

[space.GWRF]
k_neighbours = { type = "int", low = 8, high = 60 }
alpha = { type = "float", low = 0.0, high = 1.0 }
kernel = { type = "categorical", choices = ["bisquare", "uniform"] }
max_depth = { type = "int", low = 3, high = 20 }
min_samples_leaf = { type = "int", low = 1, high = 30, log = true }
max_features = { type = "int", low = 1, high = 4 }

[space.GWXGB]
k_neighbours = { type = "int", low = 8, high = 60 }
alpha = { type = "float", low = 0.0, high = 1.0 }
kernel = { type = "categorical", choices = ["bisquare", "uniform"] }
n_estimators = { type = "int", low = 50, high = 300, step = 50 }
learning_rate = { type = "float", low = 0.03, high = 0.3, log = true }
max_depth = { type = "int", low = 2, high = 6 }
min_child_weight = { type = "float", low = 1.0, high = 20.0, log = true }
subsample = { type = "float", low = 0.6, high = 1.0 }
reg_lambda = { type = "float", low = 0.001, high = 10.0, log = true }
