# V7 regression settings: soil parameters that control ground movement when groundwater or soil moisture
# changes (clay consolidation, sand settlement, shrink-swell), 0-15 m, Downtown Siem Reap.
# Inputs: Easting, Northing, sample top elevation, logged soil type.
# Test A = V3's spatial CV (106 m blocks, honest); Test B = one random 80:20 borehole split (comparison only).
# The folds and the 11 external-holdout boreholes are V3's (read from the V3 folder, never changed).
# Every choice is here: change a value in this file, never inside a notebook.

[run]
# quick = true runs a tiny version (1 outer fold, 2 Optuna trials, small models) to check the code.
# Quick results are NEVER thesis results.
quick = false
seed = 20261103
n_jobs = 4

[v3]
# V7 READS (never writes): data/folds/ (blockCV folds, block size), data/processed/external_holdout.csv
# and config/external_holdout.lock.json
folder = "E:/DavidAn/SiemReapML_V3_fresh_start/SiemReapML"

[files]
boreholes_csv = "data/raw/SiemReap_BH_Master_Downtown_DEM_Region_v1_ArcGIS.csv"
boreholes_sha256 = "caf59d0b4bd244303fc48679d28fc62fd572c9175a856744b07554e48f380f72"
region_downtown = "Downtown"

[samples]
# One row = one sample record with a measured value. Its depth is the middle of the record.
top_m = 0.0
bottom_m = 15.0                   # middle depth must lie in [top_m, bottom_m]
max_sample_length_m = 3.0         # longer records are not point values
elevation = "top"                 # "top": ground elevation - top depth of the record (as the Phnom Penh notebook)
                                  # "mid": ground elevation - middle depth (as V2)
outlier_sd = 3.0                  # drop values beyond mean +- 3 SD (as Khamjan et al. 2026); 0 = off.
                                  # Applies to every target except those with their own outlier_sd (SPT_N: 0, cap only)

# ------------------------------------------------------------------ targets ----
# Why these parameters (notebook 01, section 5, and the README):
#   clay consolidation when groundwater falls: Void_Ratio (e0), Water_Content (w), LL (-> Cc), Wet_Unit_Weight
#     (stress change), Specific_Gravity (check e0 = w Gs), Su (strength, and sigma'p estimate)
#   sand settlement: SPT_N (stiffness)
#   shrink-swell of clay with seasonal moisture: LL, PL (PI = LL - PL), Fines, Water_Content
# column  = column in the borehole CSV (a missing column is reported and skipped)
# log     = true: models learn log(1 + value); every score is on the original scale
# min/max = values outside are treated as errors and dropped (reported in notebook 02)
[targets.SPT_N]
column = "SPT_N"
unit = "blows/30 cm"
log = true
min = 0
max = 60                          # as Khamjan et al. (2026): N > 60 treated as refusal
outlier_sd = 0                    # SPT-N: only the cap at 60, no 3 SD rule

[targets.Water_Content]
column = "Water_Content_pct"
unit = "%"
log = false
min = 0
max = 150

[targets.LL]
column = "LL_pct"
unit = "%"
log = false
min = 0
max = 150

[targets.PL]
column = "PL_pct"
unit = "%"
log = false
min = 0
max = 100

[targets.Void_Ratio]
column = "Void_Ratio"
unit = "-"
log = false
min = 0.1
max = 4.0

[targets.Wet_Unit_Weight]
column = "Wet_Unit_Weight_kN_m3"
unit = "kN/m3"
log = false
min = 12
max = 25

[targets.Specific_Gravity]
column = "Specific_Gravity"
unit = "-"
log = false
min = 2.4
max = 3.0

[targets.Fines]
column = "Silt_Clay_pct"
unit = "%"
log = false
min = 0
max = 100

[targets.Eu]
column = "Eu_MPa"
unit = "MPa"
log = true
min = 0
max = 300
uscs = ["CL", "CH"]               # undrained modulus: measured on clay samples only

[targets.E_eff]
column = "E_eff_MPa"
unit = "MPa"
log = true
min = 0
max = 300
uscs = ["SC", "SM", "SP"]         # drained modulus: measured on sand samples only

[targets.Su]
column = "Su_kPa"
unit = "kPa"
log = true
min = 0
max = 500
uscs = ["CL", "CH"]               # clay samples only: the compressible layer

# ---------------------------------------------------------------------- EDA ----
[eda]
# Notebook 01 looks at the raw file BEFORE any rule is applied.
depth_bands_m = [0, 5, 10, 15, 20, 30]      # bands for the data-availability matrix
# Data status per parameter (notebook 01, section 13), counted on Downtown values at 0-15 m:
usable_min_boreholes = 40                   # >= 40 boreholes with a value: usable for spatial regression
borderline_min_boreholes = 20               # 20-39: borderline; fewer: too few (use a correlation instead)

[cv]
k = 5
# Directly measured parameters only; PI = LL - PL is computed from the predictions, not modelled.
# 10 targets. Not modelled: Specific_Gravity (2.60-2.76, use the median), dry / saturated / submerged unit weight,
# porosity and saturation (calculated from w, Gs, e0 and the wet unit weight), c' and phi' (not needed for movement).
targets = ["SPT_N", "Water_Content", "LL", "PL", "Void_Ratio", "Wet_Unit_Weight", "Fines", "Su", "Eu", "E_eff"]
models = ["RF", "XGB", "MLP", "GWRF", "GWXGB"]
# plus two references without ML or tuning:
#   "Depth"     = training mean per 1 m depth slice
#   "SoilDepth" = training mean per soil group and 1 m depth slice
#   (if a model does not beat SoilDepth, location adds nothing beyond soil type and depth)
block_multiples = [1]             # V3's 106 m blocks only
depth_bin_m = 1.0                 # depth-only reference: training mean per 1 m slice
depth_min_samples = 5             # slices with fewer training samples use the overall mean

[soil_input]
# The 4th input: the soil type of the sample as logged in the borehole. Samples of other symbols are left out.
# mode = "clay_sand": Clay (1) / Sand (0), as V2
# mode = "uscs6":     the 6 groups below (as the Yangon notebooks); trees use the group number, MLP one 0/1 column per group
mode = "clay_sand"
# Targets that always use Clay/Sand, also in "uscs6" mode: USCS CL/CH/ML is defined from LL and PI,
# so the 6 groups would hand the model part of the answer for LL and PL.
clay_sand_only = ["LL", "PL", "Fines"]   # Fines: the USCS symbol itself is set by fines >= 50 %
min_group_samples = 30            # "uscs6": a group with fewer samples of a target is left out for that target

[soil_input.clay_sand]
clay = ["CL", "CH"]               # 1
sand = ["SC", "SM", "SP"]         # 0

[soil_input.uscs6]                # group number = order here
CH = ["CH"]
CL = ["CL"]
ML = ["ML", "MH"]
SC = ["SC"]
SM = ["SM"]
SP = ["SP", "SP-SM"]

[random_split]
# Test B: one random split of the development boreholes, the same split for every target and model.
test_share = 0.2                  # 20 % of the boreholes are the test set
inner_k = 5                       # tuning: 5 random borehole groups inside the 80 %

[cv.n_trials]
RF = 30
XGB = 30
MLP = 30
GWRF = 20
GWXGB = 20

[gw]
# Geographically weighted models (as V3): local model per training borehole from its k nearest boreholes
min_boreholes = 5
min_samples = 20                  # a neighbourhood needs at least this many samples, else the global model
max_neighbours = 80
local_rf_trees = 100
local_xgb_rounds_max = 300

[inner_cv]
# Inner folds = the other 4 outer folds; if one is too small, V3's backup inner folds are used.
min_boreholes = 8
min_samples = 30

[quick]
outer_folds = [1]
n_trials = 2
trees = 50

# ------------------------------------------------------------ Optuna search spaces ----
[space.RF]
n_estimators = { type = "int", low = 200, high = 600, step = 100 }
max_depth = { type = "int", low = 3, high = 30 }
min_samples_leaf = { type = "int", low = 1, high = 50, log = true }
max_features = { type = "int", low = 1, high = 4 }
max_samples = { type = "float", low = 0.5, high = 1.0 }

[space.XGB]
n_estimators = { type = "int", low = 100, high = 800, step = 50 }
learning_rate = { type = "float", low = 0.01, high = 0.3, log = true }
max_depth = { type = "int", low = 2, high = 10 }
min_child_weight = { type = "float", low = 1.0, high = 30.0, log = true }
subsample = { type = "float", low = 0.5, high = 1.0 }
colsample_bynode = { type = "float", low = 0.5, high = 1.0 }
reg_lambda = { type = "float", low = 0.001, high = 10.0, log = true }
gamma = { type = "float", low = 0.0, high = 5.0 }

[space.MLP]
n_layers = { type = "int", low = 1, high = 3 }
n_units = { type = "int", low = 8, high = 128, log = true }
activation = { type = "categorical", choices = ["relu", "tanh"] }
alpha = { type = "float", low = 1e-6, high = 0.1, log = true }
learning_rate_init = { type = "float", low = 1e-4, high = 1e-2, log = true }
batch_size = { type = "categorical", choices = [32, 64, 128] }
max_iter = { type = "int", low = 200, high = 1000, step = 100 }

[space.GWRF]
k_neighbours = { type = "int", low = 8, high = 60 }
alpha = { type = "float", low = 0.0, high = 1.0 }
kernel = { type = "categorical", choices = ["bisquare", "uniform"] }
max_depth = { type = "int", low = 3, high = 20 }
min_samples_leaf = { type = "int", low = 1, high = 30, log = true }
max_features = { type = "int", low = 1, high = 4 }

[space.GWXGB]
k_neighbours = { type = "int", low = 8, high = 60 }
alpha = { type = "float", low = 0.0, high = 1.0 }
kernel = { type = "categorical", choices = ["bisquare", "uniform"] }
n_estimators = { type = "int", low = 50, high = 300, step = 50 }
learning_rate = { type = "float", low = 0.03, high = 0.3, log = true }
max_depth = { type = "int", low = 2, high = 6 }
min_child_weight = { type = "float", low = 1.0, high = 20.0, log = true }
subsample = { type = "float", low = 0.6, high = 1.0 }
reg_lambda = { type = "float", low = 0.001, high = 10.0, log = true }
